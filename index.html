<style>
:root{--bg:#0f0f1a;--card-bg:#1a1a2e;--text:#e8e8f0;--accent:#7c3aed;--gold:#d4a84b;--border:rgba(255,255,255,.06)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans TC',-apple-system,sans-serif;background:var(--bg);color:#e8e8f0}
.header{text-align:center;padding:48px 24px 32px}.header h1{font-size:2.5em;font-weight:700;margin-bottom:8px;color:var(--gold)}.header p{color:#999;font-size:1.05em;letter-spacing:2px}
.toolbar{max-width:1200px;margin:0 auto 32px;padding:0 24px}.search-box{width:100%;padding:12px 20px;border-radius:12px;border:1px solid var(--border);background:var(--card-bg);color:#e8e8f0;font-size:1em;outline:none}
.bookshelf{max-width:1200px;margin:0 auto;padding:0 24px 80px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:24px}
.book-card{background:var(--card-bg);border-radius:16px;overflow:hidden;cursor:pointer;border:1px solid var(--border);transition:all .4s}
.book-card:hover{transform:translateY(-8px) scale(1.02);box-shadow:0 20px 60px rgba(124,58,237,.2),0 0 0 1px var(--accent);border-color:var(--accent)}
.book-cover{height:160px;display:flex;align-items:center;justify-content:center;font-size:3em}
.cover-0{background:linear-gradient(135deg,#667eea,#764ba2)}.cover-1{background:linear-gradient(135deg,#f093fb,#f5576c)}
.cover-2{background:linear-gradient(135deg,#4facfe,#00f2fe)}.cover-3{background:linear-gradient(135deg,#43e97b,#38f9d7)}
.cover-4{background:linear-gradient(135deg,#fa709a,#fee140)}.cover-5{background:linear-gradient(135deg,#a18cd1,#fbc2eb)}
.cover-6{background:linear-gradient(135deg,#fccb90,#d57eeb)}.cover-7{background:linear-gradient(135deg,#e0c3fc,#8ec5fc)}
.book-info{padding:20px}.book-title{font-size:1.2em;font-weight:700;margin-bottom:6px;line-height:1.4}
.book-meta{color:#999;font-size:.85em;display:flex;gap:12px}.footer{text-align:center;padding:30px;color:#999;border-top:1px solid var(--border)}
@media(max-width:768px){.bookshelf{grid-template-columns:1fr}.header h1{font-size:1.8em}}
</style>
